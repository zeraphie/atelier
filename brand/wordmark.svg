<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -800 1830 1090" width="520" role="img" aria-label="Atelier">
  <title>Atelier</title>
  <desc>
    The A and L of Cinzel Decorative as outlines rather than as text, lifted
    once from src/fonts/cinzel-decorative-700.woff2 and set as the face kerns
    the pair: the A's tail passes under the L, and the L's foot carries over
    it.

    This is the copy to open and to work on. The app paints its own, inline
    in index.html, because a loader that has to fetch a file is a loader that
    has to wait for one. If these two paths change, that copy changes with
    them.

    Drawn here as the app draws it: once, then held. For a still wordmark,
    drop the style block and give the paths a fill.
  </desc>
  <style>
    path {
      fill: none;
      stroke: oklch(20% 0.01 260);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 800ms ease-in-out forwards;
    }
    path + path {
      animation-delay: 180ms;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      path {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
