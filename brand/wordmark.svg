<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -787 4389 1030.9" width="640" role="img" aria-label="Atelier">
  <title>Atelier</title>
  <desc>
    The word in Cinzel Decorative as outlines rather than as text, lifted
    once from src/fonts/cinzel-decorative-700.woff2 and set as the face
    kerns it.

    This is the copy to open and to work on. The app paints its own, inline
    in index.html, because a loader that has to fetch a file is a loader that
    has to wait for one. If these paths change, that copy changes with them.

    Drawn here as the app draws it: letter after letter, once, then held.
    For a still wordmark, drop the style block and give the paths a fill.
  </desc>
  <style>
    path {
      fill: none;
      stroke: oklch(20% 0.01 260);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 700ms ease-in-out forwards;
      animation-delay: calc(var(--i) * 110ms);
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      path {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
