<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier</title>
    <style>
      /* The mark, and the only thing on screen until the stage has a
         frame. Its colours are written out rather than taken from the
         tokens: the stylesheet arrives with the module, and this has to
         be painted before that, or a loader is just another thing to
         load. They are the canvas, ink, muted and accent tokens of
         src/index.css. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 999;
        /* The same ground behind the two halves. On an odd number of
           pixels they meet on half of one, and the hairline that leaves
           would show the canvas through it. It goes the moment they part. */
        background: oklch(93% 0.003 260);
      }
      #loading .marks {
        position: absolute;
        width: 0;
        height: 0;
      }
      /* Two halves of one curtain. Each is half the window wide and
         hides what falls outside it. */
      #loading .half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        overflow: hidden;
        background: oklch(93% 0.003 260);
        transition: transform 400ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      #loading .left {
        left: 0;
      }
      #loading .right {
        right: 0;
      }
      /* Inside each half, the whole window. The mark is centred in that,
         so it lands in the same place on both sides and the seam falls
         down the middle of the letters. */
      #loading .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 200%;
        display: grid;
        place-items: center;
      }
      #loading .left .pane {
        left: 0;
      }
      #loading .right .pane {
        right: 0;
      }
      #loading svg {
        width: min(70vw, 440px);
      }
      /* pathLength makes each outline one unit long whatever its real
         length, so every letter draws at one pace without measuring any, each
         a beat after the one before.
         The stroke is set on the use and inherited by the path it
         stands for. The draw runs once, from the first paint, and holds:
         a mark cut off half-drawn reads as a fault rather than as a
         wait. It runs on the main thread, so the app's chunks wait to
         run until it is done; downloading meanwhile costs it nothing. */
      #loading use {
        fill: none;
        stroke: oklch(20% 0.01 260);
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 700ms ease-in-out forwards;
        animation-delay: calc(var(--i) * 110ms);
      }
      /* Under the mark, from the first paint: the word, with three of
         its letters rolling like a drum for as long as the wait lasts,
         each at its own pace. Transform and opacity only, which the
         compositor animates on its own, so the chunks running meanwhile
         on the main thread cannot stall it. */
      #loading .wait {
        position: absolute;
        inset: calc(50% + 96px) 0 auto 0;
        margin: 0;
        text-align: center;
        font:
          700 13px/1 "Libertinus Sans",
          system-ui,
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: oklch(50% 0.01 260);
      }
      #loading .wait span {
        display: inline-block;
      }
      #loading .wait .roll {
        color: oklch(58% 0.19 262);
        animation: roll var(--pace) linear infinite;
      }
      /* A load that failed: the word gives way to what to do. */
      #loading .trouble {
        display: none;
        position: absolute;
        inset: calc(50% + 96px) 0 auto 0;
        margin: 0;
        text-align: center;
        font:
          15px/1.5 "Libertinus Sans",
          system-ui,
          sans-serif;
        color: oklch(50% 0.01 260);
      }
      #loading[data-state="failed"] .wait {
        display: none;
      }
      #loading[data-state="failed"] .trouble {
        display: block;
      }
      /* Opened: the halves leave by their own sides, each with its share
         of the letters. The curtain module takes the node off after the
         same length. */
      #loading.done {
        pointer-events: none;
        background: transparent;
      }
      #loading.done .left {
        transform: translateX(-100%);
      }
      #loading.done .right {
        transform: translateX(100%);
      }
      #loading.done .wait {
        display: none;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* Out through the bottom, fading, then straight back in from the top. */
      @keyframes roll {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        50% {
          transform: translateY(100%);
          opacity: 0;
        }
        51% {
          transform: translateY(-100%);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      /* Asked for stillness: the mark stands drawn, the word stands
         still, and the curtain goes straight off rather than sliding. */
      @media (prefers-reduced-motion: reduce) {
        #loading use,
        #loading .wait span {
          animation: none;
        }
        #loading use {
          stroke-dashoffset: 0;
        }
        #loading .half {
          transition: opacity 200ms ease;
        }
        #loading.done .half {
          transform: none;
          opacity: 0;
        }
      }
    </style>
  </head>

         at and to work on is brand/wordmark.svg. Changing the heading
